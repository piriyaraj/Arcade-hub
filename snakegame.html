<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Snake Game</title>
  <style>
    :root {
      --bg: #0b0f1a;
      --board-bg: #111827;
      --snake-head: #4ade80;
      --snake-body: #22c55e;
      --snake-glow: #86efac;
      --food: #f43f5e;
      --food-glow: #fda4af;
      --border: #4f83cc;
      --text: #e8eaed;
      --text-dim: #9aa0a6;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Segoe UI', system-ui, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
      user-select: none;
    }

    header {
      padding: 16px 20px 8px;
      text-align: center;
      width: 100%;
      position: relative;
    }

    .back-btn {
      position: absolute;
      left: 20px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-dim);
      text-decoration: none;
      font-size: 0.9rem;
      padding: 6px 12px;
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 8px;
      transition: all 0.2s ease;
    }

    .back-btn:hover {
      color: var(--text);
      border-color: var(--snake-head);
      background: rgba(255,255,255,0.05);
    }

    header h1 {
      font-size: 2rem;
      font-weight: 800;
      letter-spacing: 0.1em;
      background: linear-gradient(135deg, var(--snake-glow), var(--food));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    header p {
      color: var(--text-dim);
      font-size: 0.85rem;
      margin-top: 2px;
    }

    #stats {
      display: flex;
      gap: 32px;
      justify-content: center;
      padding: 8px 0 4px;
    }

    .stat {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .stat-label {
      font-size: 0.65rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--text-dim);
    }

    .stat-value {
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--snake-glow);
    }

    #canvas-wrap {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      padding: 4px 12px 8px;
    }

    canvas {
      border-radius: 12px;
      box-shadow:
        0 0 0 2px rgba(79, 131, 204, 0.3),
        0 8px 32px rgba(0, 0, 0, 0.6),
        0 0 80px rgba(79, 131, 204, 0.1);
      display: block;
      max-width: 100%;
    }

    #controls {
      display: flex;
      gap: 12px;
      padding: 10px 20px 16px;
      justify-content: center;
      flex-wrap: wrap;
    }

    button {
      background: linear-gradient(135deg, var(--border), var(--snake-glow));
      color: #fff;
      border: none;
      padding: 8px 20px;
      border-radius: 8px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.1s, box-shadow 0.15s;
      box-shadow: 0 2px 12px rgba(79, 131, 204, 0.4);
    }

    button:hover {
      transform: translateY(-1px);
      box-shadow: 0 4px 18px rgba(79, 131, 204, 0.6);
    }

    button:active { transform: translateY(0); }

    button.play-btn {
      background: linear-gradient(135deg, var(--snake-head), var(--snake-glow));
      box-shadow: 0 2px 12px rgba(74, 222, 128, 0.4);
      font-size: 1rem;
      padding: 10px 28px;
    }

    button.play-btn:hover {
      box-shadow: 0 4px 18px rgba(74, 222, 128, 0.6);
    }

    #overlay {
      position: fixed;
      inset: 0;
      background: rgba(11, 15, 26, 0.85);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 10;
      backdrop-filter: blur(4px);
    }

    #overlay.hidden { display: none; }

    #overlay h2 {
      font-size: 2.5rem;
      font-weight: 800;
      background: linear-gradient(135deg, var(--snake-glow), var(--food));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 8px;
    }

    #overlay p {
      color: var(--text-dim);
      margin-bottom: 24px;
      text-align: center;
      max-width: 300px;
      line-height: 1.5;
    }

    #overlay .final-score {
      font-size: 3rem;
      font-weight: 800;
      color: var(--snake-glow);
      margin-bottom: 24px;
    }

    .high-score-badge {
      font-size: 1rem;
      color: var(--food);
      margin-bottom: 16px;
    }

    /* Mobile D-pad and optimization styles */
    #dpad {
      display: none;
      flex-direction: column;
      align-items: center;
      margin: 8px 0;
      gap: 6px;
      user-select: none;
      -webkit-user-select: none;
    }

    .dpad-row {
      display: flex;
      gap: 6px;
      justify-content: center;
    }

    button.dpad-btn {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.08);
      border: 2px solid rgba(79, 131, 204, 0.4);
      color: var(--text);
      font-size: 1.25rem;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
      transition: background 0.1s, transform 0.05s;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
      padding: 0;
    }

    button.dpad-btn:hover {
      transform: none;
      background: rgba(255, 255, 255, 0.12);
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
    }

    button.dpad-btn:active {
      background: var(--border);
      border-color: var(--snake-glow);
      transform: scale(0.92);
      box-shadow: 0 0 10px rgba(134, 239, 172, 0.5);
    }

    .dpad-space {
      width: 52px;
      height: 52px;
    }

    @media (max-width: 768px) {
      body {
        overflow-y: auto;
      }
      header {
        padding: 8px 20px 4px;
      }
      header h1 {
        font-size: 1.6rem;
      }
      #stats {
        padding: 4px 0 2px;
        gap: 16px;
      }
      .stat-value {
        font-size: 1.2rem;
      }
      #canvas-wrap {
        padding: 2px 12px 4px;
      }
      #dpad {
        display: flex;
      }
      #controls {
        padding: 4px 20px 12px;
      }
    }
  </style>
</head>
<body>

<div id="overlay">
  <h2>SNAKE GAME</h2>
  <p>Use arrow keys or WASD to control the snake. Swipe or tap the D-pad to control on mobile devices. Eat the red food to grow and score points!</p>
  <button class="play-btn" id="start-btn" aria-label="Start Snake Game">START GAME</button>
</div>

<header>
  <a href="index.html" class="back-btn">&larr; Home</a>
  <h1>SNAKE GAME</h1>
  <p>Eat food — grow longer — don't hit the walls!</p>
</header>

<div id="stats">
  <div class="stat">
    <span class="stat-label">Score</span>
    <span class="stat-value" id="score" aria-live="polite" aria-atomic="true">0</span>
  </div>
  <div class="stat">
    <span class="stat-label">Length</span>
    <span class="stat-value" id="length">3</span>
  </div>
  <div class="stat">
    <span class="stat-label">Best</span>
    <span class="stat-value" id="best">0</span>
  </div>
</div>

<div id="canvas-wrap">
  <canvas id="game" aria-label="Snake game canvas. Control the snake with arrow keys or WASD to eat food and grow without hitting walls."></canvas>
</div>

<div id="dpad" class="mobile-only">
  <div class="dpad-row">
    <button id="dpad-up" class="dpad-btn">▲</button>
  </div>
  <div class="dpad-row">
    <button id="dpad-left" class="dpad-btn">◀</button>
    <div class="dpad-space"></div>
    <button id="dpad-right" class="dpad-btn">▶</button>
  </div>
  <div class="dpad-row">
    <button id="dpad-down" class="dpad-btn">▼</button>
  </div>
</div>

<div id="controls">
  <button class="play-btn" id="pause-btn" aria-label="Pause or resume the game">PAUSE</button>
  <button id="reset-btn" aria-label="Restart game">RESTART</button>
<script src="audio.js"></script>
<script>
// ─── Constants ────────────────────────────────────────────────────────────────
const CELL_SIZE = 20;
const GRID_COLOR = '#1f2937';
const INITIAL_SPEED = 120;
const SPEED_INCREMENT = 2;
const MIN_SPEED = 50;

// ─── Canvas Setup ─────────────────────────────────────────────────────────────
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

let W, H, cols, rows;

function resize() {
  const wrap = document.getElementById('canvas-wrap');
  const maxW = Math.min(wrap.clientWidth - 24, 520);
  const isMobile = window.innerWidth <= 768;
  const maxH = window.innerHeight * (isMobile ? 0.38 : 0.55);

  cols = Math.floor(maxW / CELL_SIZE);
  rows = Math.floor(maxH / CELL_SIZE);

  // Ensure minimum grid size
  cols = Math.max(15, Math.min(cols, 26));
  rows = Math.max(15, Math.min(rows, 26));

  W = cols * CELL_SIZE;
  H = rows * CELL_SIZE;

  canvas.width = W;
  canvas.height = H;
}

window.addEventListener('resize', () => {
  resize();
  if (gameStarted && !gameOver) {
    draw();
  }
});

// ─── Game State ──────────────────────────────────────────────────────────────
let snake = [];
let food = { x: 0, y: 0 };
let direction = { x: 1, y: 0 };
let nextDirection = { x: 1, y: 0 };
let score = 0;
let bestScore = parseInt(localStorage.getItem('snake_best') || '0');
let gameStarted = false;
let gameOver = false;
let gamePaused = false;
let speed = INITIAL_SPEED;
let lastUpdate = 0;
let particles = [];

// ─── DOM Elements ─────────────────────────────────────────────────────────────
const scoreEl = document.getElementById('score');
const lengthEl = document.getElementById('length');
const bestEl = document.getElementById('best');
const pauseBtn = document.getElementById('pause-btn');
const resetBtn = document.getElementById('reset-btn');
const overlay = document.getElementById('overlay');
const startBtn = document.getElementById('start-btn');

bestEl.textContent = bestScore;

// ─── Game Initialization ──────────────────────────────────────────────────────
function initGame() {
  snake = [
    { x: Math.floor(cols / 2), y: Math.floor(rows / 2) },
    { x: Math.floor(cols / 2) - 1, y: Math.floor(rows / 2) },
    { x: Math.floor(cols / 2) - 2, y: Math.floor(rows / 2) }
  ];
  direction = { x: 1, y: 0 };
  nextDirection = { x: 1, y: 0 };
  score = 0;
  speed = INITIAL_SPEED;
  particles = [];
  spawnFood();
  updateUI();
}

function spawnFood() {
  let newFood;
  do {
    newFood = {
      x: Math.floor(Math.random() * cols),
      y: Math.floor(Math.random() * rows)
    };
  } while (snake.some(s => s.x === newFood.x && s.y === newFood.y));
  food = newFood;
}

// ─── UI Updates ────────────────────────────────────────────────────────────────
function updateUI() {
  scoreEl.textContent = score;
  lengthEl.textContent = snake.length;
}

function showGameOver() {
  gameOver = true;
  gameStarted = false;
  pauseBtn.disabled = true;
  if (window.sfx) window.sfx.playGameOver();

  const isNewBest = score > bestScore;
  if (isNewBest) {
    bestScore = score;
    localStorage.setItem('snake_best', bestScore);
    bestEl.textContent = bestScore;
  }

  overlay.innerHTML = `
    <h2>GAME OVER</h2>
    <div class="final-score">${score}</div>
    ${isNewBest ? '<div class="high-score-badge">🏆 New High Score!</div>' : ''}
    <p>You reached a length of ${snake.length}!</p>
    <button class="play-btn" onclick="restartGame()">PLAY AGAIN</button>
  `;
  overlay.classList.remove('hidden');
}

// ─── Particles ────────────────────────────────────────────────────────────────
function spawnParticles(x, y, color, count = 10) {
  for (let i = 0; i < count; i++) {
    const angle = (Math.PI * 2 * i) / count + Math.random() * 0.5;
    const spd = 1.5 + Math.random() * 2.5;
    particles.push({
      x: x * CELL_SIZE + CELL_SIZE / 2,
      y: y * CELL_SIZE + CELL_SIZE / 2,
      vx: Math.cos(angle) * spd,
      vy: Math.sin(angle) * spd,
      life: 1,
      decay: 0.025 + Math.random() * 0.02,
      r: 3 + Math.random() * 3,
      color
    });
  }
}

function updateParticles() {
  for (let p of particles) {
    p.x += p.vx;
    p.y += p.vy;
    p.vx *= 0.95;
    p.vy *= 0.95;
    p.life -= p.decay;
  }
  particles = particles.filter(p => p.life > 0);
}

// ─── Game Logic ────────────────────────────────────────────────────────────────
function update() {
  // Update direction
  direction = { ...nextDirection };

  // Calculate new head position
  const head = {
    x: snake[0].x + direction.x,
    y: snake[0].y + direction.y
  };

  // Check wall collision
  if (head.x < 0 || head.x >= cols || head.y < 0 || head.y >= rows) {
    showGameOver();
    return;
  }

  // Check self collision
  if (snake.some(s => s.x === head.x && s.y === head.y)) {
    showGameOver();
    return;
  }

  // Add new head
  snake.unshift(head);

  // Check food collision
  if (head.x === food.x && head.y === food.y) {
    score += 10;
    if (window.sfx) window.sfx.playEat();
    spawnParticles(food.x, food.y, '#f43f5e', 15);
    spawnFood();

    // Increase speed
    speed = Math.max(MIN_SPEED, speed - SPEED_INCREMENT);
    updateUI();
  } else {
    // Remove tail if no food eaten
    snake.pop();
  }
}

// ─── Drawing ──────────────────────────────────────────────────────────────────
function draw() {
  // Clear canvas
  ctx.fillStyle = '#0f1419';
  ctx.fillRect(0, 0, W, H);

  // Draw grid
  ctx.strokeStyle = GRID_COLOR;
  ctx.lineWidth = 0.5;
  for (let x = 0; x <= cols; x++) {
    ctx.beginPath();
    ctx.moveTo(x * CELL_SIZE, 0);
    ctx.lineTo(x * CELL_SIZE, H);
    ctx.stroke();
  }
  for (let y = 0; y <= rows; y++) {
    ctx.beginPath();
    ctx.moveTo(0, y * CELL_SIZE);
    ctx.lineTo(W, y * CELL_SIZE);
    ctx.stroke();
  }

  // Draw food with glow
  const foodX = food.x * CELL_SIZE + CELL_SIZE / 2;
  const foodY = food.y * CELL_SIZE + CELL_SIZE / 2;

  // Food glow
  const foodGlow = ctx.createRadialGradient(foodX, foodY, 0, foodX, foodY, CELL_SIZE);
  foodGlow.addColorStop(0, 'rgba(244, 63, 94, 0.5)');
  foodGlow.addColorStop(1, 'rgba(244, 63, 94, 0)');
  ctx.fillStyle = foodGlow;
  ctx.beginPath();
  ctx.arc(foodX, foodY, CELL_SIZE * 0.8, 0, Math.PI * 2);
  ctx.fill();

  // Food body
  ctx.fillStyle = '#f43f5e';
  ctx.beginPath();
  ctx.arc(foodX, foodY, CELL_SIZE * 0.35, 0, Math.PI * 2);
  ctx.fill();

  // Food shine
  ctx.fillStyle = 'rgba(255, 255, 255, 0.4)';
  ctx.beginPath();
  ctx.arc(foodX - 2, foodY - 2, CELL_SIZE * 0.12, 0, Math.PI * 2);
  ctx.fill();

  // Draw snake
  snake.forEach((segment, index) => {
    const x = segment.x * CELL_SIZE;
    const y = segment.y * CELL_SIZE;
    const padding = 1;
    const size = CELL_SIZE - padding * 2;

    if (index === 0) {
      // Head glow
      const headGlow = ctx.createRadialGradient(
        x + CELL_SIZE / 2, y + CELL_SIZE / 2, 0,
        x + CELL_SIZE / 2, y + CELL_SIZE / 2, CELL_SIZE * 0.8
      );
      headGlow.addColorStop(0, 'rgba(134, 239, 172, 0.4)');
      headGlow.addColorStop(1, 'rgba(134, 239, 172, 0)');
      ctx.fillStyle = headGlow;
      ctx.beginPath();
      ctx.arc(x + CELL_SIZE / 2, y + CELL_SIZE / 2, CELL_SIZE * 0.7, 0, Math.PI * 2);
      ctx.fill();

      // Head
      const headGrd = ctx.createLinearGradient(x, y, x + size, y + size);
      headGrd.addColorStop(0, '#86efac');
      headGrd.addColorStop(1, '#22c55e');
      ctx.fillStyle = headGrd;
      roundRect(ctx, x + padding, y + padding, size, size, 5);
      ctx.fill();

      // Eyes based on direction
      ctx.fillStyle = '#0f1419';
      const eyeSize = 3;
      const eyeOffset = 5;
      let eye1X, eye1Y, eye2X, eye2Y;

      if (direction.x === 1) { // Right
        eye1X = x + CELL_SIZE - eyeOffset; eye1Y = y + 5;
        eye2X = x + CELL_SIZE - eyeOffset; eye2Y = y + CELL_SIZE - 5 - eyeSize;
      } else if (direction.x === -1) { // Left
        eye1X = x + eyeOffset - eyeSize; eye1Y = y + 5;
        eye2X = x + eyeOffset - eyeSize; eye2Y = y + CELL_SIZE - 5 - eyeSize;
      } else if (direction.y === -1) { // Up
        eye1X = x + 5; eye1Y = y + eyeOffset - eyeSize;
        eye2X = x + CELL_SIZE - 5 - eyeSize; eye2Y = y + eyeOffset - eyeSize;
      } else { // Down
        eye1X = x + 5; eye1Y = y + CELL_SIZE - eyeOffset;
        eye2X = x + CELL_SIZE - 5 - eyeSize; eye2Y = y + CELL_SIZE - eyeOffset;
      }

      ctx.beginPath();
      ctx.arc(eye1X + eyeSize/2, eye1Y + eyeSize/2, eyeSize, 0, Math.PI * 2);
      ctx.arc(eye2X + eyeSize/2, eye2Y + eyeSize/2, eyeSize, 0, Math.PI * 2);
      ctx.fill();
    } else {
      // Body segment
      const alpha = 1 - (index / snake.length) * 0.5;
      const bodyGrd = ctx.createLinearGradient(x, y, x + size, y + size);
      bodyGrd.addColorStop(0, `rgba(74, 222, 128, ${alpha})`);
      bodyGrd.addColorStop(1, `rgba(34, 197, 94, ${alpha})`);
      ctx.fillStyle = bodyGrd;
      roundRect(ctx, x + padding + 1, y + padding + 1, size - 2, size - 2, 4);
      ctx.fill();
    }
  });

  // Draw particles
  for (let p of particles) {
    ctx.globalAlpha = p.life;
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r * p.life, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}

function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r);
  ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r);
  ctx.quadraticCurveTo(x, y, x + r, y);
  ctx.closePath();
}

// ─── Game Loop ────────────────────────────────────────────────────────────────
function gameLoop(timestamp) {
  if (gameStarted && !gameOver && !gamePaused) {
    if (timestamp - lastUpdate >= speed) {
      update();
      lastUpdate = timestamp;
    }
  }

  updateParticles();
  draw();
  requestAnimationFrame(gameLoop);
}

// ─── Controls ─────────────────────────────────────────────────────────────────
function startGame() {
  overlay.classList.add('hidden');
  gameStarted = true;
  gameOver = false;
  gamePaused = false;
  pauseBtn.disabled = false;
  pauseBtn.textContent = 'PAUSE';
  initGame();
}

function restartGame() {
  overlay.classList.add('hidden');
  gameStarted = true;
  gameOver = false;
  gamePaused = false;
  pauseBtn.disabled = false;
  pauseBtn.textContent = 'PAUSE';
  initGame();
}

function togglePause() {
  if (!gameStarted || gameOver) return;
  gamePaused = !gamePaused;
  pauseBtn.textContent = gamePaused ? 'RESUME' : 'PAUSE';
}

// Keyboard controls
document.addEventListener('keydown', (e) => {
  if (!gameStarted || gameOver) {
    if (e.code === 'Space' || e.code === 'Enter') {
      e.preventDefault();
      if (!gameStarted || gameOver) {
        restartGame();
      }
    }
    return;
  }

  if (gamePaused && e.code !== 'Escape' && e.code !== 'Space') {
    return;
  }

  switch (e.code) {
    case 'ArrowUp':
    case 'KeyW':
      if (direction.y !== 1) {
        nextDirection = { x: 0, y: -1 };
      }
      e.preventDefault();
      break;
    case 'ArrowDown':
    case 'KeyS':
      if (direction.y !== -1) {
        nextDirection = { x: 0, y: 1 };
      }
      e.preventDefault();
      break;
    case 'ArrowLeft':
    case 'KeyA':
      if (direction.x !== 1) {
        nextDirection = { x: -1, y: 0 };
      }
      e.preventDefault();
      break;
    case 'ArrowRight':
    case 'KeyD':
      if (direction.x !== -1) {
        nextDirection = { x: 1, y: 0 };
      }
      e.preventDefault();
      break;
    case 'Space':
    case 'Escape':
      e.preventDefault();
      togglePause();
      break;
  }
});

// ─── Event Listeners ───────────────────────────────────────────────────────────
startBtn.addEventListener('click', startGame);
pauseBtn.addEventListener('click', togglePause);
resetBtn.addEventListener('click', restartGame);

// ─── Touch and Swipe Controls ──────────────────────────────────────────────────
let touchStartX = 0;
let touchStartY = 0;

canvas.addEventListener('touchstart', (e) => {
  if (e.touches.length === 1) {
    touchStartX = e.touches[0].clientX;
    touchStartY = e.touches[0].clientY;
  }
}, { passive: true });

canvas.addEventListener('touchmove', (e) => {
  // Prevent scrolling when swiping inside the game area
  if (gameStarted && !gameOver && !gamePaused) {
    if (e.cancelable) e.preventDefault();
  }
}, { passive: false });

canvas.addEventListener('touchend', (e) => {
  if (e.changedTouches.length === 1) {
    const endX = e.changedTouches[0].clientX;
    const endY = e.changedTouches[0].clientY;
    handleSwipe(touchStartX, touchStartY, endX, endY);
  }
}, { passive: true });

function handleSwipe(startX, startY, endX, endY) {
  if (!gameStarted || gameOver || gamePaused) return;

  const dx = endX - startX;
  const dy = endY - startY;
  const absDx = Math.abs(dx);
  const absDy = Math.abs(dy);
  const threshold = 30; // Minimum swipe distance in pixels

  if (Math.max(absDx, absDy) < threshold) return;

  if (absDx > absDy) {
    // Horizontal swipe
    if (dx > 0) {
      // Swipe Right
      if (direction.x !== -1) {
        nextDirection = { x: 1, y: 0 };
      }
    } else {
      // Swipe Left
      if (direction.x !== 1) {
        nextDirection = { x: -1, y: 0 };
      }
    }
  } else {
    // Vertical swipe
    if (dy > 0) {
      // Swipe Down
      if (direction.y !== -1) {
        nextDirection = { x: 0, y: 1 };
      }
    } else {
      // Swipe Up
      if (direction.y !== 1) {
        nextDirection = { x: 0, y: -1 };
      }
    }
  }
}

// ─── Mobile D-pad Controls ─────────────────────────────────────────────────────
const dpadUp = document.getElementById('dpad-up');
const dpadDown = document.getElementById('dpad-down');
const dpadLeft = document.getElementById('dpad-left');
const dpadRight = document.getElementById('dpad-right');

function handleDirectionChange(newDir) {
  if (!gameStarted || gameOver || gamePaused) return;

  if (newDir === 'UP' && direction.y !== 1) {
    nextDirection = { x: 0, y: -1 };
  } else if (newDir === 'DOWN' && direction.y !== -1) {
    nextDirection = { x: 0, y: 1 };
  } else if (newDir === 'LEFT' && direction.x !== 1) {
    nextDirection = { x: -1, y: 0 };
  } else if (newDir === 'RIGHT' && direction.x !== -1) {
    nextDirection = { x: 1, y: 0 };
  }
}

const handleDpadPress = (dir) => (e) => {
  e.preventDefault();
  handleDirectionChange(dir);
};

if (dpadUp && dpadDown && dpadLeft && dpadRight) {
  dpadUp.addEventListener('touchstart', handleDpadPress('UP'), { passive: false });
  dpadDown.addEventListener('touchstart', handleDpadPress('DOWN'), { passive: false });
  dpadLeft.addEventListener('touchstart', handleDpadPress('LEFT'), { passive: false });
  dpadRight.addEventListener('touchstart', handleDpadPress('RIGHT'), { passive: false });

  dpadUp.addEventListener('mousedown', (e) => { e.preventDefault(); handleDirectionChange('UP'); });
  dpadDown.addEventListener('mousedown', (e) => { e.preventDefault(); handleDirectionChange('DOWN'); });
  dpadLeft.addEventListener('mousedown', (e) => { e.preventDefault(); handleDirectionChange('LEFT'); });
  dpadRight.addEventListener('mousedown', (e) => { e.preventDefault(); handleDirectionChange('RIGHT'); });
}

// ─── Init ─────────────────────────────────────────────────────────────────────
resize();
initGame();
requestAnimationFrame(gameLoop);
</script>
