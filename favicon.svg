<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGradient" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#111827" />
      <stop offset="100%" stop-color="#070a13" />
    </radialGradient>

    <!-- Diagonal Linear Gradient for borders -->
    <linearGradient id="neonGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="100%" stop-color="#ff007f" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="100" height="100" rx="20" fill="url(#bgGradient)" />
  <rect x="2" y="2" width="96" height="96" rx="18" fill="none" stroke="url(#neonGradient)" stroke-width="2" opacity="0.3" />

  <!-- Arcade Cabinet Silhouette -->
  <!-- Outline / Body with a nice cyan/purple styling -->
  <path d="M30 18 L70 18 L73 28 L68 28 L68 50 L78 54 L78 62 L68 64 L68 85 L32 85 L32 64 L22 62 L22 54 L32 50 L32 28 L27 28 Z"
        fill="#1f293d"
        stroke="#00f0ff"
        stroke-width="2.5"
        stroke-linejoin="round"
        style="filter: drop-shadow(0 0 4px rgba(0, 240, 255, 0.4));" />

  <!-- Screen -->
  <rect x="36" y="32" width="28" height="18" rx="2" fill="#0b0f1a" stroke="#4ade80" stroke-width="1.5" style="filter: drop-shadow(0 0 2px rgba(74, 222, 128, 0.6));" />

  <!-- Mini Screen Graphic (Pixel-style Space Invader) -->
  <path d="M48 37h4v2h-4zm-2 2h8v2h-8zm-2 2h12v2h-12zm-2 4h3v2h-3zm13 0h3v2h-3z" fill="#4ade80" />

  <!-- Control Panel Joystick -->
  <!-- Shaft -->
  <line x1="42" y1="58" x2="38" y2="52" stroke="#e8eaed" stroke-width="1.5" stroke-linecap="round" />
  <!-- Red Knob -->
  <circle cx="38" cy="52" r="3.5" fill="#ff007f" style="filter: drop-shadow(0 0 3px rgba(255, 0, 127, 0.8));" />

  <!-- Control Panel Buttons (two glowing buttons) -->
  <circle cx="54" cy="56" r="2.2" fill="#00f0ff" style="filter: drop-shadow(0 0 2px rgba(0, 240, 255, 0.8));" />
  <circle cx="62" cy="56" r="2.2" fill="#ff007f" style="filter: drop-shadow(0 0 2px rgba(255, 0, 127, 0.8));" />

  <!-- Marquee Yellow/Orange/Pink Glow -->
  <rect x="32.5" y="20" width="35" height="7" fill="#ff007f" opacity="0.8" style="filter: drop-shadow(0 0 3px rgba(255, 0, 127, 0.8));" />
  <text x="50" y="25.5" font-family="monospace, sans-serif" font-size="5" font-weight="bold" fill="#ffffff" text-anchor="middle">PLAY</text>
</svg>
