<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Pachinko-style arcade game. Drop balls through the peg grid and score big in high-value slots." />
  <title>Bing Ball</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <style>
    :root {
      --bg: #0b0f1a;
      --board-bg: #111827;
      --peg: #4f83cc;
      --peg-glow: #6fa8e8;
      --ball: #f4a20a;
      --ball-glow: #ffd966;
      --slot-a: #e74c3c;
      --slot-b: #e67e22;
      --slot-c: #f1c40f;
      --slot-d: #2ecc71;
      --slot-e: #3498db;
      --slot-f: #9b59b6;
      --slot-g: #e74c3c;
      --text: #e8eaed;
      --text-dim: #9aa0a6;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Segoe UI', system-ui, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
      user-select: none;
    }

    header {
      padding: 16px 20px 8px;
      text-align: center;
      width: 100%;
      position: relative;
    }

    .back-btn {
      position: absolute;
      left: 20px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-dim);
      text-decoration: none;
      font-size: 0.9rem;
      padding: 6px 12px;
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 8px;
      transition: all 0.2s ease;
    }

    .back-btn:hover {
      color: var(--text);
      border-color: var(--peg-glow);
      background: rgba(255,255,255,0.05);
    }

    .mute-btn {
      position: absolute;
      right: 20px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-dim);
      background: none;
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 8px;
      padding: 6px 12px;
      font-size: 0.9rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s ease;
    }

    .mute-btn:hover {
      color: var(--text);
      border-color: var(--peg-glow);
      background: rgba(255, 255, 255, 0.05);
    }

    header h1 {
      font-size: 2rem;
      font-weight: 800;
      letter-spacing: 0.1em;
      background: linear-gradient(135deg, var(--peg-glow), var(--ball));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    header p {
      color: var(--text-dim);
      font-size: 0.85rem;
      margin-top: 2px;
    }

    #stats {
      display: flex;
      gap: 24px;
      justify-content: center;
      padding: 8px 0 4px;
    }

    .stat {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .stat-label {
      font-size: 0.65rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--text-dim);
    }

    .stat-value {
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--ball);
    }

    #canvas-wrap {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      padding: 4px 12px 8px;
    }

    canvas {
      border-radius: 12px;
      box-shadow:
        0 0 0 2px rgba(79, 131, 204, 0.3),
        0 8px 32px rgba(0, 0, 0, 0.6),
        0 0 80px rgba(79, 131, 204, 0.1);
      display: block;
      max-width: 100%;
    }

    #controls {
      display: flex;
      gap: 12px;
      padding: 10px 20px 16px;
      justify-content: center;
      flex-wrap: wrap;
    }

    button {
      background: linear-gradient(135deg, var(--peg), var(--peg-glow));
      color: #fff;
      border: none;
      padding: 8px 20px;
      border-radius: 8px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.1s, box-shadow 0.15s;
      box-shadow: 0 2px 12px rgba(79, 131, 204, 0.4);
    }

    button:hover {
      transform: translateY(-1px);
      box-shadow: 0 4px 18px rgba(79, 131, 204, 0.6);
    }

    button:active { transform: translateY(0); }

    button.drop-btn {
      background: linear-gradient(135deg, var(--ball), #f7c948);
      box-shadow: 0 2px 12px rgba(244, 162, 10, 0.4);
      font-size: 1rem;
      padding: 10px 28px;
    }

    button.drop-btn:hover {
      box-shadow: 0 4px 18px rgba(244, 162, 10, 0.6);
    }

    button.drop-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
      transform: none;
    }

    #overlay {
      position: fixed;
      inset: 0;
      background: rgba(11, 15, 26, 0.85);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 10;
      backdrop-filter: blur(4px);
    }

    #overlay.hidden { display: none; }

    #overlay h2 {
      font-size: 2.5rem;
      font-weight: 800;
      background: linear-gradient(135deg, var(--peg-glow), var(--ball));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 8px;
    }

    #overlay p {
      color: var(--text-dim);
      margin-bottom: 24px;
      text-align: center;
      max-width: 300px;
      line-height: 1.5;
    }

    #overlay .final-score {
      font-size: 3rem;
      font-weight: 800;
      color: var(--ball);
      margin-bottom: 24px;
    }
  </style>
</head>
<body>

<div id="overlay">
  <h2>BING BALL</h2>
  <p>Drop balls and watch them bounce through the pegs. Land in the high-value slots to score big!</p>
  <button class="drop-btn" id="start-btn" data-action="start" aria-label="Start Bing Ball Game">START GAME</button>
</div>

<header>
  <a href="index.html" class="back-btn">&larr; Home</a>
  <h1>BING BALL</h1>
  <p>Drop the ball — bounce through the pegs</p>
  <button class="mute-btn" id="mute-btn" aria-label="Toggle sound">🔊 Sound On</button>
</header>

<div id="stats">
  <div class="stat">
    <span class="stat-label">Score</span>
    <span class="stat-value" id="score" aria-live="polite" aria-atomic="true">0</span>
  </div>
  <div class="stat">
    <span class="stat-label">Balls</span>
    <span class="stat-value" id="balls-left">10</span>
  </div>
  <div class="stat">
    <span class="stat-label">Best</span>
    <span class="stat-value" id="best">0</span>
  </div>
</div>

<div id="canvas-wrap">
  <canvas id="game" aria-label="Bing Ball game canvas. Drop balls to bounce through pegs and land in high-value scoring slots."></canvas>
</div>

<div id="controls">
  <button class="drop-btn" id="drop-btn" data-action="drop" aria-label="Drop a ball" disabled>DROP BALL</button>
  <button id="reset-btn" data-action="reset" aria-label="Reset game">RESET</button>
</div>

<script src="audio.js"></script>
<script>
// ─── Constants ────────────────────────────────────────────────────────────────
const BALL_COUNT = 10;
const ROWS = 9;
const COLS = 9;
const ROW_SPACING = 58;
const COL_SPACING = 64;
const PEG_RADIUS = 6;
const BALL_RADIUS = 10;
const GRAVITY = 0.25;
const BOUNCE = 0.65;
const FRICTION = 0.99;
const SLOT_SCORES = [100, 250, 500, 1000, 2500, 1000, 500, 250, 100];
const SLOT_COLORS = ['#e74c3c','#e67e22','#f1c40f','#2ecc71','#3498db','#9b59b6','#3498db','#2ecc71','#f1c40f'];

// ─── Canvas Setup ─────────────────────────────────────────────────────────────
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

let W, H, boardX, boardY, boardW, boardH, slotW;

function resize() {
  const wrap = document.getElementById('canvas-wrap');
  const maxH = window.innerHeight * 0.62;
  const maxW = Math.min(wrap.clientWidth - 24, 560);

  W = maxW;
  H = Math.min(maxH, 620);

  canvas.width = W;
  canvas.height = H;

  boardX = 20;
  boardY = 20;
  boardW = W - 40;
  boardH = H - 80;
  slotW = boardW / SLOT_SCORES.length;
}

window.addEventListener('resize', () => {
  resize();
  initPegs();
});

// ─── Game State ──────────────────────────────────────────────────────────────
let pegs = [];
let balls = [];
let particles = [];
let dropMarker = null;
let score = 0;
let ballsLeft = BALL_COUNT;
let gameRunning = false;
let gameOver = false;
let bestScore = 0;
try {
  const raw = localStorage.getItem('bingball_best');
  const parsed = parseInt(raw, 10);
  bestScore = Number.isFinite(parsed) ? parsed : 0;
} catch (e) {
  bestScore = 0;
}

const scoreEl = document.getElementById('score');
const ballsEl = document.getElementById('balls-left');
const bestEl = document.getElementById('best');
const dropBtn = document.getElementById('drop-btn');
const resetBtn = document.getElementById('reset-btn');
const overlay = document.getElementById('overlay');
const startBtn = document.getElementById('start-btn');
const muteBtn = document.getElementById('mute-btn');

bestEl.textContent = bestScore;

// Mute/Unmute state loading & initialization
let soundMuted = false;
try {
  soundMuted = localStorage.getItem('bingball_muted') === 'true';
} catch (e) {
  soundMuted = false;
}

if (window.sfx) {
  window.sfx.muted = soundMuted;
}

function updateMuteButtonUI() {
  if (window.sfx) {
    muteBtn.textContent = window.sfx.muted ? '🔇 Sound Off' : '🔊 Sound On';
  }
}

function toggleMute() {
  if (window.sfx) {
    window.sfx.muted = !window.sfx.muted;
    try {
      localStorage.setItem('bingball_muted', window.sfx.muted.toString());
    } catch (e) {}
    updateMuteButtonUI();
    if (typeof window.sfx.init === 'function') {
      window.sfx.init();
    }
  }
}

updateMuteButtonUI();
muteBtn.addEventListener('click', toggleMute);

// M-key shortcut
window.addEventListener('keydown', (e) => {
  if ((e.key === 'm' || e.key === 'M') && !e.repeat) {
    toggleMute();
  }
});

// ─── Peg Generation ──────────────────────────────────────────────────────────
function initPegs() {
  pegs = [];
  const boardCX = boardX + boardW / 2;

  for (let r = 0; r < ROWS; r++) {
    const offset = (r % 2 === 0) ? 0 : COL_SPACING / 2;
    const rowY = boardY + 20 + r * ROW_SPACING;
    const pegsInRow = (r % 2 === 0) ? COLS : COLS - 1;

    for (let c = 0; c < pegsInRow; c++) {
      const px = boardCX - ((pegsInRow - 1) * COL_SPACING) / 2 + c * COL_SPACING;
      pegs.push({ x: px, y: rowY, r: PEG_RADIUS });
    }
  }
}

// ─── Ball Factory ────────────────────────────────────────────────────────────
function createBall(x) {
  const finalX = (typeof x === 'number') ? x : (boardX + boardW / 2 + (Math.random() - 0.5) * 60);
  return {
    x: finalX,
    y: boardY + 2,
    vx: (Math.random() - 0.5) * 3,
    vy: 0,
    r: BALL_RADIUS,
    color: `hsl(${35 + Math.random() * 20}, 95%, 60%)`,
    glow: `hsl(${35 + Math.random() * 20}, 100%, 75%)`,
    active: true,
    landed: false,
    scoreGiven: false
  };
}

function createBallAt(x) {
  return createBall(x);
}

// ─── Particles ────────────────────────────────────────────────────────────────
function spawnParticles(x, y, color, count = 8) {
  for (let i = 0; i < count; i++) {
    const angle = (Math.PI * 2 * i) / count + Math.random() * 0.5;
    const speed = 2 + Math.random() * 3;
    particles.push({
      x, y,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed,
      life: 1,
      decay: 0.03 + Math.random() * 0.02,
      r: 3 + Math.random() * 3,
      color
    });
  }
}

// ─── Drop Ball ────────────────────────────────────────────────────────────────
function dropBall(x) {
  if (ballsLeft <= 0 || !gameRunning) return;
  ballsLeft--;
  ballsEl.textContent = ballsLeft;
  balls.push(createBallAt(x));
  if (ballsLeft <= 0) {
    dropBtn.disabled = true;
  }
}

// ─── Physics ─────────────────────────────────────────────────────────────────
function updateBalls() {
  for (let b of balls) {
    if (!b.active) continue;

    b.vy += GRAVITY;
    b.vx *= FRICTION;

    b.x += b.vx;
    b.y += b.vy;

    // Wall collisions
    if (b.x - b.r < boardX) {
      b.x = boardX + b.r;
      b.vx = Math.abs(b.vx) * BOUNCE;
    }
    if (b.x + b.r > boardX + boardW) {
      b.x = boardX + boardW - b.r;
      b.vx = -Math.abs(b.vx) * BOUNCE;
    }

    // Peg collisions
    for (let p of pegs) {
      const dx = b.x - p.x;
      const dy = b.y - p.y;
      const dist = Math.sqrt(dx * dx + dy * dy);
      const minDist = b.r + p.r;

      if (dist < minDist && dist > 0) {
        const nx = dx / dist;
        const ny = dy / dist;
        const overlap = minDist - dist;

        b.x += nx * overlap;
        b.y += ny * overlap;

        const dot = b.vx * nx + b.vy * ny;
        b.vx = (b.vx - 2 * dot * nx) * BOUNCE;
        b.vy = (b.vy - 2 * dot * ny) * BOUNCE;

        if (window.sfx) window.sfx.playBounce();
        spawnParticles(p.x, p.y, '#6fa8e8', 5);
      }
    }

    // Floor — slot detection
    const floorY = boardY + boardH - 14;
    if (b.y + b.r >= floorY && !b.landed) {
      b.y = floorY - b.r;
      b.landed = true;

      // Find slot
      const relX = b.x - boardX;
      let slotIdx = Math.floor(relX / slotW);
      slotIdx = Math.max(0, Math.min(slotIdx, SLOT_SCORES.length - 1));

      const pts = SLOT_SCORES[slotIdx];
      b.vx = 0;
      b.vy = 0;

      if (!b.scoreGiven) {
        b.scoreGiven = true;
        score += pts;
        scoreEl.textContent = score;
        if (window.sfx) window.sfx.playScoreSlot();
        spawnParticles(b.x, floorY, SLOT_COLORS[slotIdx] || '#fff', 16);
        flashSlot(slotIdx);
      }
    }

    // Remove balls that settle
    if (b.landed && Math.abs(b.vy) < 0.1) {
      b.active = false;
    }
  }

  // Clean up old settled balls
  balls = balls.filter(b => b.active);

  // Check game over
  if (ballsLeft <= 0 && balls.length === 0 && !gameOver) {
    gameOver = true;
    setTimeout(showGameOver, 600);
  }
}

// ─── Slot Flash ───────────────────────────────────────────────────────────────
let flashSlotIdx = -1;
let flashAlpha = 0;

function flashSlot(idx) {
  flashSlotIdx = idx;
  flashAlpha = 1;
}

// ─── Particles Update ────────────────────────────────────────────────────────
function updateParticles() {
  for (let p of particles) {
    p.x += p.vx;
    p.y += p.vy;
    p.vy += 0.1;
    p.life -= p.decay;
  }
  particles = particles.filter(p => p.life > 0);
}

// ─── Rendering ───────────────────────────────────────────────────────────────
let frameCount = 0;

function render() {
  ctx.clearRect(0, 0, W, H);

  // Board background
  ctx.fillStyle = '#111827';
  roundRect(ctx, boardX, boardY, boardW, boardH, 14);
  ctx.fill();

  // Board border
  ctx.strokeStyle = 'rgba(79,131,204,0.25)';
  ctx.lineWidth = 2;
  roundRect(ctx, boardX, boardY, boardW, boardH, 14);
  ctx.stroke();

  // Slots
  const floorY = boardY + boardH - 14;
  for (let i = 0; i <= SLOT_SCORES.length; i++) {
    const sx = boardX + i * slotW;
    ctx.fillStyle = 'rgba(255,255,255,0.04)';
    ctx.fillRect(sx, floorY, slotW, 14);

    if (i < SLOT_SCORES.length) {
      const color = SLOT_COLORS[i];
      const isFlashing = (flashSlotIdx === i && flashAlpha > 0);
      const alpha = isFlashing ? flashAlpha : 0.8;
      ctx.fillStyle = hexAlpha(color, alpha);
      ctx.fillRect(sx + 2, floorY + 2, slotW - 4, 10);

      ctx.fillStyle = `rgba(255,255,255,${alpha * 0.9})`;
      ctx.font = `bold 9px 'Segoe UI', sans-serif`;
      ctx.textAlign = 'center';
      ctx.fillText(SLOT_SCORES[i], sx + slotW / 2, floorY + 10);
    }
  }

  // Flash decay
  if (flashAlpha > 0) flashAlpha -= 0.04;

  // Pegs
  const pulse = Math.sin(frameCount * 0.05) * 0.15 + 0.85;
  for (let p of pegs) {
    // Glow
    const grd = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.r * 3);
    grd.addColorStop(0, `rgba(111,168,232,${0.4 * pulse})`);
    grd.addColorStop(1, 'rgba(111,168,232,0)');
    ctx.fillStyle = grd;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r * 3, 0, Math.PI * 2);
    ctx.fill();

    // Peg
    const pegGrd = ctx.createRadialGradient(p.x - p.r * 0.3, p.y - p.r * 0.3, 0, p.x, p.y, p.r);
    pegGrd.addColorStop(0, '#7eb8f0');
    pegGrd.addColorStop(1, '#3d6ea8');
    ctx.fillStyle = pegGrd;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
    ctx.fill();
  }

  // Drop zone indicator
  const dropZoneTop = boardY;
  ctx.fillStyle = 'rgba(244,162,10,0.06)';
  ctx.fillRect(boardX + 20, dropZoneTop, boardW - 40, ROW_SPACING);

  // Balls
  for (let b of balls) {
    if (!b.active && b.landed) continue;

    // Ball glow
    const ballGrd = ctx.createRadialGradient(b.x, b.y, 0, b.x, b.y, b.r * 2.5);
    ballGrd.addColorStop(0, `rgba(255,215,80,0.6)`);
    ballGrd.addColorStop(1, 'rgba(255,180,0,0)');
    ctx.fillStyle = ballGrd;
    ctx.beginPath();
    ctx.arc(b.x, b.y, b.r * 2.5, 0, Math.PI * 2);
    ctx.fill();

    // Ball
    const ballBody = ctx.createRadialGradient(b.x - b.r * 0.3, b.y - b.r * 0.3, 0, b.x, b.y, b.r);
    ballBody.addColorStop(0, '#fff5cc');
    ballBody.addColorStop(0.4, b.color);
    ballBody.addColorStop(1, '#c87000');
    ctx.fillStyle = ballBody;
    ctx.beginPath();
    ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
    ctx.fill();

    // Shine
    ctx.fillStyle = 'rgba(255,255,255,0.5)';
    ctx.beginPath();
    ctx.arc(b.x - b.r * 0.3, b.y - b.r * 0.3, b.r * 0.35, 0, Math.PI * 2);
    ctx.fill();
  }

  // Drop marker visual feedback
  if (dropMarker) {
    ctx.strokeStyle = `rgba(244, 162, 10, ${dropMarker.alpha})`;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(dropMarker.x, dropMarker.y, BALL_RADIUS * 2, 0, Math.PI * 2);
    ctx.stroke();

    ctx.fillStyle = `rgba(244, 162, 10, ${dropMarker.alpha * 0.3})`;
    ctx.beginPath();
    ctx.arc(dropMarker.x, dropMarker.y, BALL_RADIUS, 0, Math.PI * 2);
    ctx.fill();

    dropMarker.alpha -= 0.05;
    if (dropMarker.alpha <= 0) dropMarker = null;
  }

  // Particles
  for (let p of particles) {
    ctx.globalAlpha = p.life;
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r * p.life, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}

function hexAlpha(hex, alpha) {
  // Convert hex to rgba
  const r = parseInt(hex.slice(1, 3), 16);
  const g = parseInt(hex.slice(3, 5), 16);
  const b = parseInt(hex.slice(5, 7), 16);
  return `rgba(${r},${g},${b},${alpha})`;
}

function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r);
  ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r);
  ctx.quadraticCurveTo(x, y, x + r, y);
  ctx.closePath();
}

// ─── Game Loop ────────────────────────────────────────────────────────────────
function gameLoop() {
  frameCount++;
  updateBalls();
  updateParticles();
  render();
  requestAnimationFrame(gameLoop);
}

// ─── Game Start / Over ───────────────────────────────────────────────────────
function startGame() {
  overlay.classList.add('hidden');
  gameRunning = true;
  gameOver = false;
  score = 0;
  ballsLeft = BALL_COUNT;
  balls = [];
  particles = [];
  scoreEl.textContent = '0';
  ballsEl.textContent = ballsLeft;
  dropBtn.disabled = false;
  // Auto-drop first ball
  setTimeout(dropBall, 400);
}

function showGameOver() {
  if (window.sfx) window.sfx.playGameOver();
  const isNewBest = score > bestScore;
  if (isNewBest) {
    bestScore = score;
    try {
      localStorage.setItem('bingball_best', String(bestScore));
    } catch (e) {
      // Silently fail - best score won't persist but game continues
    }
    bestEl.textContent = bestScore;
  }

  const overlayEl = document.getElementById('overlay');
  overlayEl.innerHTML = `
    <h2>GAME OVER</h2>
    <div class="final-score">${score.toLocaleString()}</div>
    <p>${score === bestScore ? '🏆 New High Score!' : `Best: ${bestScore.toLocaleString()}`}</p>
    <button id="play-again-btn" class="drop-btn" data-action="play-again">PLAY AGAIN</button>
  `;
  overlayEl.classList.remove('hidden');
  gameRunning = false;
  dropBtn.disabled = true;
}

// ─── Controls ─────────────────────────────────────────────────────────────────
// Delegated click handler: route every [data-action] button through one place
// so dynamically rendered buttons (e.g. PLAY AGAIN in the game-over overlay)
// can be bound without inline onclick attributes (CSP-safe).
document.addEventListener('click', (e) => {
  const btn = e.target.closest('[data-action]');
  if (!btn) return;
  switch (btn.dataset.action) {
    case 'start':
      startGame();
      break;
    case 'drop':
      dropBall();
      break;
    case 'reset':
      location.reload();
      break;
    case 'play-again':
      location.reload();
      break;
  }
});

// Keyboard: space to drop
document.addEventListener('keydown', (e) => {
  if (e.code === 'Space' && gameRunning && ballsLeft > 0) {
    e.preventDefault();
    dropBall();
  }
});

// Canvas touch / click to drop in drop zone
canvas.addEventListener('click', (e) => {
  if (!gameRunning || ballsLeft <= 0) return;
  const rect = canvas.getBoundingClientRect();
  const scaleX = W / rect.width;
  const scaleY = H / rect.height;
  const clickX = (e.clientX - rect.left) * scaleX;
  const clickY = (e.clientY - rect.top) * scaleY;

  if (clickX >= boardX && clickX <= boardX + boardW && clickY >= boardY && clickY <= boardY + ROW_SPACING) {
    const clampedX = Math.max(boardX + BALL_RADIUS, Math.min(boardX + boardW - BALL_RADIUS, clickX));
    dropMarker = { x: clampedX, y: clickY, alpha: 1.0 };
    dropBall(clampedX);
  }
});

// ─── Init ─────────────────────────────────────────────────────────────────────
resize();
initPegs();
gameLoop();
</script>
</body>
</html>
