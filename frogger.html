  <style>
    :root {
      --bg: #0b0f1a;
      --board-bg: #070a13;
      --theme-neon: #00f0ff; /* Cyan */
      --theme-yellow: #facc15; /* Yellow */
      --theme-pink: #ff007f; /* Pink / Vehicle / Obstacle */
      --theme-green: #4ade80; /* Green / Player & Goal */
      --border: rgba(0, 240, 255, 0.2);
      --text: #e8eaed;
      --text-dim: #9aa0a6;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Segoe UI', system-ui, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      overflow-x: hidden;
      user-select: none;
    }

    header {
      padding: 16px 20px 8px;
      text-align: center;
      width: 100%;
      position: relative;
      max-width: 600px;
    }

    .back-btn {
      position: absolute;
      left: 20px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-dim);
      text-decoration: none;
      font-size: 0.9rem;
      padding: 6px 12px;
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 8px;
      transition: all 0.2s ease;
    }

    .back-btn:hover {
      color: var(--text);
      border-color: var(--theme-neon);
      background: rgba(255,255,255,0.05);
    }

    .mute-btn {
      position: absolute;
      right: 20px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-dim);
      background: none;
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 8px;
      padding: 6px 12px;
      font-size: 0.9rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s ease;
    }

    .mute-btn:hover {
      color: var(--text);
      border-color: var(--theme-neon);
      background: rgba(255, 255, 255, 0.05);
    }

    header h1 {
      font-size: 2rem;
      font-weight: 800;
      letter-spacing: 0.1em;
      background: linear-gradient(135deg, var(--theme-green), var(--theme-neon));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    header p {
      color: var(--text-dim);
      font-size: 0.85rem;
      margin-top: 2px;
    }

    #stats {
      display: flex;
      gap: 32px;
      justify-content: center;
      padding: 8px 0 4px;
      width: 100%;
      max-width: 600px;
    }

    .stat {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .stat-label {
      font-size: 0.65rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--text-dim);
    }

    .stat-value {
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--theme-green);
    }

    .stat-value.neon-val {
      color: var(--theme-neon);
    }

    #canvas-wrap {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      padding: 4px 12px 8px;
      max-width: 480px;
    }

    canvas {
      background: var(--board-bg);
      border-radius: 12px;
      box-shadow:
        0 0 0 2px rgba(0, 240, 255, 0.2),
        0 8px 32px rgba(0, 0, 0, 0.6),
        0 0 80px rgba(0, 240, 255, 0.05);
      display: block;
      max-width: 100%;
      height: auto;
      aspect-ratio:  3 / 4;
      cursor: pointer;
    }

    #controls {
      display: flex;
      gap: 12px;
      padding: 10px 20px 16px;
      justify-content: center;
      flex-wrap: wrap;
      width: 100%;
      max-width: 600px;
    }

    button {
      background: linear-gradient(135deg, rgba(255,255,255,0.05), rgba(255,255,255,0.15));
      color: #fff;
      border: 1px solid rgba(255,255,255,0.15);
      padding: 8px 20px;
      border-radius: 8px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.1s, box-shadow 0.15s, border-color 0.15s;
    }

    button:hover {
      transform: translateY(-1px);
      border-color: var(--theme-neon);
      box-shadow: 0 4px 12px rgba(0, 240, 255, 0.2);
    }

    button:active { transform: translateY(0); }

    button.play-btn {
      background: linear-gradient(135deg, var(--theme-green), #16a34a);
      color: #000;
      border: none;
      box-shadow: 0 2px 12px rgba(74, 222, 128, 0.4);
      font-size: 1rem;
      padding: 10px 28px;
    }

    button.play-btn:hover {
      box-shadow: 0 4px 18px rgba(74, 222, 128, 0.6);
      border-color: transparent;
    }

    #overlay {
      position: fixed;
      inset: 0;
      background: rgba(11, 15, 26, 0.9);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 10;
      backdrop-filter: blur(6px);
      padding: 20px;
    }

    #overlay.hidden { display: none; }

    #overlay h2 {
      font-size: 2.5rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      background: linear-gradient(135deg, var(--theme-green), var(--theme-pink));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 8px;
      text-align: center;
      text-shadow: 0 0 30px rgba(74, 222, 128, 0.2);
    }

    #overlay p {
      color: var(--text-dim);
      margin-bottom: 24px;
      text-align: center;
      max-width: 400px;
      line-height: 1.6;
      font-size: 0.95rem;
    }

    #overlay .final-score {
      font-size: 1.8rem;
      font-weight: 700;
      color: var(--theme-green);
      margin-bottom: 24px;
    }

    /* Mobile D-pad and optimization styles */
    #dpad {
      display: none;
      flex-direction: column;
      align-items: center;
      margin: 8px 0;
      gap: 6px;
      user-select: none;
      -webkit-user-select: none;
    }

    .dpad-row {
      display: flex;
      gap: 6px;
      justify-content: center;
    }

    button.dpad-btn {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.08);
      border: 2px solid rgba(79, 131, 204, 0.4);
      color: var(--text);
      font-size: 1.25rem;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
      transition: background 0.1s, transform 0.05s;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
      padding: 0;
    }

    button.dpad-btn:hover {
      transform: none;
      background: rgba(255, 255, 255, 0.12);
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
    }

    button.dpad-btn:active {
      background: var(--border);
      border-color: var(--theme-green);
      transform: scale(0.92);
      box-shadow: 0 0 10px rgba(74, 222, 128, 0.5);
    }

    .dpad-space {
      width: 52px;
      height: 52px;
    }

    @media (max-width: 768px) {
      body {
        overflow-y: auto;
      }
      header {
        padding: 8px 20px 4px;
      }
      header h1 {
        font-size: 1.6rem;
      }
      #stats {
        padding: 4px 0 2px;
        gap: 16px;
      }
      .stat-value {
        font-size: 1.2rem;
      }
      #canvas-wrap {
        padding: 2px 12px 4px;
      }
      #dpad.mobile-only {
        display: flex;
      }
      #controls {
        padding: 4px 20px 12px;
      }
    }

    /* Accessible focus rings */
    canvas:focus-visible,
    button:focus-visible,
    [tabindex]:focus-visible {
      outline: 3px solid #16a34a;
      outline-offset: 2px;
    }
  </style>
</head>

<script>
  (function() {
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');

    function getThemeColor(key, fallback) {
      if (window.ThemeManager) {
        return window.ThemeManager.getColor(key) || fallback;
      }
      return fallback;
    }

    window.addEventListener('themechange', () => {
      if (state === 'start' || state === 'paused' || state === 'gameover') {
        draw();
      }
    });

    const scoreEl = document.getElementById('score');
    const levelEl = document.getElementById('level-val');
    const bestEl = document.getElementById('best');
    const overlay = document.getElementById('overlay');
    const overlayTitle = document.getElementById('overlay-title');
    const overlayDesc = document.getElementById('overlay-desc');
    const finalScoreContainer = document.getElementById('final-score-container');
    const finalScore = document.getElementById('final-score');
    const startBtn = document.getElementById('start-btn');
    const pauseBtn = document.getElementById('pause-btn');
    const resetBtn = document.getElementById('reset-btn');
    const muteBtn = document.getElementById('mute-btn');

    // Canvas Base Specs
    const WIDTH = canvas.width;
    const HEIGHT = canvas.height;

    // Game States
    let state = 'start'; // 'start', 'playing', 'paused', 'gameover'
    let score = 0;
    let level = 1;
    let highScore = 0;

    if (typeof window.getBestScore === 'function') {
      highScore = window.getBestScore('frogger');
    } else {
      try {
        const raw = localStorage.getItem('frogger_best');
        const parsed = parseInt(raw, 10);
        highScore = Number.isFinite(parsed) ? parsed : 0;
      } catch (e) {
        highScore = 0;
      }
    }
    bestEl.textContent = highScore;

    // Mute/Unmute state loading & initialization
    let soundMuted = false;
    if (typeof window.getMuteState === 'function') {
      soundMuted = window.getMuteState('frogger');
    } else {
      try {
        soundMuted = localStorage.getItem('frogger_muted') === 'true';
      } catch (e) {
        soundMuted = false;
      }
    }

    if (window.sfx) {
      window.sfx.muted = soundMuted;
    }

    function updateMuteButtonUI() {
      if (window.sfx) {
        muteBtn.textContent = window.sfx.muted ? '🔇 Sound Off' : '🔊 Sound On';
      }
    }

    function toggleMute() {
      if (window.sfx) {
        window.sfx.muted = !window.sfx.muted;
        if (typeof window.saveMuteState === 'function') {
          window.saveMuteState('frogger', window.sfx.muted);
        } else {
          try {
            localStorage.setItem('frogger_muted', window.sfx.muted.toString());
          } catch (e) {
            console.error('localStorage save failed:', e);
          }
        }
        updateMuteButtonUI();
        if (typeof window.sfx.init === 'function') {
          window.sfx.init();
        }
      }
    }

    updateMuteButtonUI();
    muteBtn.addEventListener('click', toggleMute);

    // M-key shortcut
    window.addEventListener('keydown', (e) => {
      if ((e.key === 'm' || e.key === 'M') && !e.repeat) {
        toggleMute();
      }
    });

    // Game Objects
    let player = {
      x: 240,
      y: 616,
      dir: 'UP',
      row: 12
    };

    let filledGoals = [false, false, false, false, false];
    let maxRowReached = 12;

    const LANES_CONFIG = {
      // Road lanes (Rows 6 to 10)
      10: { type: 'road', dir: 1, speed: 1.3, width: 45, count: 3, spacing: 180, color: 'var(--accent-neon)', label: 'taxi' }, // right
      9:  { type: 'road', dir: -1, speed: 1.6, width: 80, count: 2, spacing: 260, color: 'var(--theme-pink)', label: 'truck' }, // left
      8:  { type: 'road', dir: 1, speed: 2.3, width: 40, count: 3, spacing: 200, color: 'var(--theme-yellow)', label: 'sports' }, // right
      7:  { type: 'road', dir: -1, speed: 1.9, width: 45, count: 3, spacing: 220, color: 'var(--accent-neon)', label: 'car' }, // left
      6:  { type: 'road', dir: 1, speed: 1.1, width: 35, count: 4, spacing: 140, color: 'var(--accent-pink)', label: 'drone' }, // right

      // River lanes (Rows 1 to 4)
      4:  { type: 'river', dir: -1, speed: 1.3, width: 100, count: 3, spacing: 190, color: 'var(--accent-neon)' }, // left
      3:  { type: 'river', dir: 1, speed: 1.7, width: 150, count: 2, spacing: 260, color: 'var(--theme-green)' }, // right
      2:  { type: 'river', dir: -1, speed: 2.2, width: 85, count: 3, spacing: 180, color: 'var(--accent-neon)' }, // left
      1:  { type: 'river', dir: 1, speed: 1.2, width: 110, count: 3, spacing: 200, color: 'var(--theme-green)' }  // right
    };

    let roadObstacles = [];
    let riverPlatforms = [];
    let particles = [];
    let stars = [];

    // Sparkles for Goals and Safe Zones
    function initStars() {
      stars = [];
      for (let i = 0; i < 30; i++) {
        stars.push({
          x: Math.random() * WIDTH,
          y: Math.random() * HEIGHT,
          size: Math.random() * 1.5 + 0.5,
          speed: Math.random() * 0.05 + 0.02,
          opacity: Math.random() * 0.5 + 0.3,
          ascending: Math.random() > 0.5
        });
      }
    }

    function initLevel() {
      roadObstacles = [];
      riverPlatforms = [];
      const speedMultiplier = 1 + (level - 1) * 0.15; // 15% faster per level

      for (const [rowStr, config] of Object.entries(LANES_CONFIG)) {
        const row = parseInt(rowStr, 10);
        const speed = config.speed * config.dir * speedMultiplier;

        for (let i = 0; i < config.count; i++) {
          const item = {
            x: i * config.spacing + Math.random() * 30 - 15,
            y: row * 48 + 24,
            width: config.width,
            height: 28,
            speed: speed,
            color: config.color,
            type: config.type,
            row: row
          };

          if (config.type === 'road') {
            roadObstacles.push(item);
          } else {
            riverPlatforms.push(item);
          }
        }
      }
    }

    function createJumpParticles(x, y) {
      const color = 'rgba(74, 222, 128, 0.7)';
      for (let i = 0; i < 6; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = Math.random() * 1.5 + 0.5;
        particles.push({
          x: x,
          y: y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          radius: Math.random() * 2 + 1,
          color: color,
          alpha: 1.0,
          decay: Math.random() * 0.04 + 0.02
        });
      }
    }

    function createCrashExplosion(x, y) {
      for (let i = 0; i < 25; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = Math.random() * 4 + 1.5;
        particles.push({
          x: x,
          y: y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          radius: Math.random() * 3 + 1.5,
          color: Math.random() > 0.5 ? 'var(--accent-pink)' : 'var(--theme-yellow)',
          alpha: 1.0,
          decay: Math.random() * 0.03 + 0.015
        });
      }
    }

    function createSplashExplosion(x, y) {
      for (let i = 0; i < 20; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = Math.random() * 3 + 1;
        particles.push({
          x: x,
          y: y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          radius: Math.random() * 3 + 1,
          color: Math.random() > 0.4 ? 'var(--theme-neon)' : '#0099ff',
          alpha: 1.0,
          decay: Math.random() * 0.035 + 0.015
        });
      }
    }

    function createGoalCelebration(x, y) {
      for (let i = 0; i < 30; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = Math.random() * 5 + 2;
        particles.push({
          x: x,
          y: y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          radius: Math.random() * 3 + 1,
          color: Math.random() > 0.6 ? '#ffffff' : 'var(--theme-green)',
          alpha: 1.0,
          decay: Math.random() * 0.03 + 0.01
        });
      }
    }

    function resetPlayer() {
      player.x = 240;
      player.row = 12;
      player.y = 616;
      player.dir = 'UP';
    }

    function update() {
      if (state !== 'playing') return;

      // Update background stars shimmer
      stars.forEach(s => {
        if (s.ascending) {
          s.opacity += s.speed;
          if (s.opacity >= 0.85) s.ascending = false;
        } else {
          s.opacity -= s.speed;
          if (s.opacity <= 0.2) s.ascending = true;
        }
      });

      // Update road vehicles
      roadObstacles.forEach(obs => {
        obs.x += obs.speed;
        if (obs.speed > 0 && obs.x > WIDTH) {
          obs.x = -obs.width;
        } else if (obs.speed < 0 && obs.x < -obs.width) {
          obs.x = WIDTH;
        }
      });

      // Update river logs
      riverPlatforms.forEach(p => {
        p.x += p.speed;
        if (p.speed > 0 && p.x > WIDTH) {
          p.x = -p.width;
        } else if (p.speed < 0 && p.x < -p.width) {
          p.x = WIDTH;
        }
      });

      // Handle river platform riding mechanics
      if (player.row >= 1 && player.row <= 4) {
        let onPlatform = false;
        for (let i = 0; i < riverPlatforms.length; i++) {
          const p = riverPlatforms[i];
          if (p.row === player.row) {
            // Check if player center fits inside standard log AABB
            if (player.x >= p.x && player.x <= p.x + p.width) {
              player.x += p.speed; // Drift!
              onPlatform = true;
              break;
            }
          }
        }
        if (!onPlatform) {
          triggerGameOver('water');
          return;
        } else {
          // Drifts out of bounds = Drown
          if (player.x < 12 || player.x > WIDTH - 12) {
            triggerGameOver('offset');
            return;
          }
        }
      }

      // Check Road collisions
      if (player.row >= 6 && player.row <= 10) {
        for (let i = 0; i < roadObstacles.length; i++) {
          const obs = roadObstacles[i];
          if (obs.row === player.row) {
            const frogBox = {
              left: player.x - 12,
              right: player.x + 12,
              top: player.y - 12,
              bottom: player.y + 12
            };
            const obsBox = {
              left: obs.x,
              right: obs.x + obs.width,
              top: obs.y - 12,
              bottom: obs.y + 12
            };
            if (frogBox.left < obsBox.right &&
                frogBox.right > obsBox.left &&
                frogBox.top < obsBox.bottom &&
                frogBox.bottom > obsBox.top) {
              triggerGameOver('road');
              return;
            }
          }
        }
      }

      // Update particles
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.alpha -= p.decay;
        if (p.alpha <= 0) {
          particles.splice(i, 1);
        }
      }
    }

    function movePlayer(dir) {
      if (state !== 'playing') return;

      player.dir = dir;
      let nextRow = player.row;
      let nextX = player.x;

      if (dir === 'UP') {
        nextRow--;
      } else if (dir === 'DOWN') {
        nextRow++;
      } else if (dir === 'LEFT') {
        nextX -= 48;
      } else if (dir === 'RIGHT') {
        nextX += 48;
      }

      if (nextRow < 0) nextRow = 0;
      if (nextRow > 12) nextRow = 12;

      // Snap back/clamp coordinate
      if (nextX < 24) nextX = 24;
      if (nextX > WIDTH - 24) nextX = WIDTH - 24;

      player.row = nextRow;
      player.x = nextX;
      // Align Y coordinate centered inside lane
      player.y = player.row === 0 ? 40 : player.row * 48 + 24;

      if (window.sfx) {
        window.sfx.playBounce();
      }

      createJumpParticles(player.x, player.y);

      // Score for going up
      if (player.row < maxRowReached) {
        const diff = maxRowReached - player.row;
        score += diff * 10;
        maxRowReached = player.row;
        scoreEl.textContent = score;
      }

      // Goal detection
      if (player.row === 0) {
        const col = Math.floor(player.x / 48);
        if (col % 2 === 1) {
          const index = (col - 1) / 2;
          if (filledGoals[index]) {
            triggerGameOver('occupied');
          } else {
            // Goal captured!
            filledGoals[index] = true;
            score += 200;
            scoreEl.textContent = score;
            createGoalCelebration(player.x, player.y);

            if (window.sfx && typeof window.sfx.playScoreSlot === 'function') {
              window.sfx.playScoreSlot();
            }

            // Check if level finished
            if (filledGoals.every(g => g === true)) {
              level++;
              score += 1000;
              scoreEl.textContent = score;
              levelEl.textContent = level;
              filledGoals = [false, false, false, false, false];
              initLevel();
            }

            resetPlayer();
            maxRowReached = 12;
          }
        } else {
          // Hit goal blocker wall
          triggerGameOver('wall');
        }
      }
    }

    function triggerGameOver(reason) {
      state = 'gameover';
      let msg = 'You were hit by a cyber vehicle!';
      if (reason === 'water') {
        msg = 'You drowned in the digital current!';
      } else if (reason === 'offset') {
        msg = 'Carried off-screen by the digital torrent!';
      } else if (reason === 'occupied') {
        msg = 'You crashed into an occupied data slot!';
      } else if (reason === 'wall') {
        msg = 'You crashed into a cyber storage firewall!';
      }

      if (window.sfx && typeof window.sfx.playGameOver === 'function') {
        window.sfx.playGameOver();
      }

      createCrashExplosion(player.x, player.y);

      let isNewHighScore = false;
      if (score > highScore) {
        highScore = score;
        bestEl.textContent = highScore;
        if (typeof window.saveBestScore === 'function') {
          window.saveBestScore('frogger', highScore);
        } else {
          try {
            localStorage.setItem('frogger_best', highScore.toString());
          } catch (e) {}
        }
        isNewHighScore = true;
      }

      setTimeout(() => {
        overlayTitle.textContent = isNewHighScore ? 'NEW HIGH SCORE!' : 'GAME OVER';
        overlayDesc.textContent = msg;
        finalScore.textContent = score;
        finalScoreContainer.classList.remove('hidden');
        startBtn.textContent = 'RESTART SYSTEM';
        overlay.classList.remove('hidden');
      }, 900);
    }

    function startGame() {
      overlay.classList.add('hidden');
      score = 0;
      level = 1;
      maxRowReached = 12;
      filledGoals = [false, false, false, false, false];
      scoreEl.textContent = score;
      levelEl.textContent = level;
      resetPlayer();
      initLevel();
      initStars();
      particles = [];
      state = 'playing';
      if (window.sfx && typeof window.sfx.init === 'function') {
        window.sfx.init();
      }
    }

    function togglePause() {
      if (state === 'playing') {
        state = 'paused';
        pauseBtn.textContent = 'RESUME';
      } else if (state === 'paused') {
        state = 'playing';
        pauseBtn.textContent = 'PAUSE';
      }
    }

    // Keyboard bindings
    window.addEventListener('keydown', (e) => {
      if (state !== 'playing') {
        if (e.key === ' ' || e.key === 'Enter') {
          if (state === 'start' || state === 'gameover') {
            startGame();
          }
        }
        return;
      }

      if (e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W') {
        movePlayer('UP');
        e.preventDefault();
      } else if (e.key === 'ArrowDown' || e.key === 's' || e.key === 'S') {
        movePlayer('DOWN');
        e.preventDefault();
      } else if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') {
        movePlayer('LEFT');
        e.preventDefault();
      } else if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') {
        movePlayer('RIGHT');
        e.preventDefault();
      }

      if (e.key === 'p' || e.key === 'P' || e.key === 'Escape') {
        togglePause();
      }
    });

    // Touch controls / D-pad
    document.getElementById('dpad-up').addEventListener('touchstart', (e) => { movePlayer('UP'); e.preventDefault(); }, { passive: false });
    document.getElementById('dpad-down').addEventListener('touchstart', (e) => { movePlayer('DOWN'); e.preventDefault(); }, { passive: false });
    document.getElementById('dpad-left').addEventListener('touchstart', (e) => { movePlayer('LEFT'); e.preventDefault(); }, { passive: false });
    document.getElementById('dpad-right').addEventListener('touchstart', (e) => { movePlayer('RIGHT'); e.preventDefault(); }, { passive: false });

    // Buttons
    startBtn.addEventListener('click', startGame);
    pauseBtn.addEventListener('click', togglePause);
    resetBtn.addEventListener('click', () => {
      startGame();
    });

    // Render methods
    function drawPlayer() {
      const radius = 12;
      ctx.save();
      ctx.shadowBlur = 10;
      ctx.shadowColor = 'var(--accent-green)';
      ctx.fillStyle = 'var(--accent-green)';
      ctx.beginPath();
      ctx.arc(player.x, player.y, radius, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();

      // Cyber style concentric ring
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.arc(player.x, player.y, radius - 3, 0, Math.PI * 2);
      ctx.stroke();

      // Cute Eyes facing moving direction
      ctx.fillStyle = '#ffffff';
      let eye1 = { x: 0, y: 0 };
      let eye2 = { x: 0, y: 0 };
      const eyeR = 2.5;

      if (player.dir === 'UP') {
        eye1 = { x: player.x - 5, y: player.y - 6 };
        eye2 = { x: player.x + 5, y: player.y - 6 };
      } else if (player.dir === 'DOWN') {
        eye1 = { x: player.x - 5, y: player.y + 6 };
        eye2 = { x: player.x + 5, y: player.y + 6 };
      } else if (player.dir === 'LEFT') {
        eye1 = { x: player.x - 6, y: player.y - 5 };
        eye2 = { x: player.x - 6, y: player.y + 5 };
      } else if (player.dir === 'RIGHT') {
        eye1 = { x: player.x + 6, y: player.y - 5 };
        eye2 = { x: player.x + 6, y: player.y + 5 };
      }

      ctx.beginPath();
      ctx.arc(eye1.x, eye1.y, eyeR, 0, Math.PI * 2);
      ctx.arc(eye2.x, eye2.y, eyeR, 0, Math.PI * 2);
      ctx.fill();

      // Pupils
      ctx.fillStyle = '#000000';
      ctx.beginPath();
      ctx.arc(eye1.x, eye1.y, 1, 0, Math.PI * 2);
      ctx.arc(eye2.x, eye2.y, 1, 0, Math.PI * 2);
      ctx.fill();
    }

    function drawSavedFrog(x, y) {
      const radius = 9;
      ctx.fillStyle = 'var(--accent-green)';
      ctx.beginPath();
      ctx.arc(x, y, radius, 0, Math.PI * 2);
      ctx.fill();

      // Eyes
      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.arc(x - 3, y - 3, 2, 0, Math.PI * 2);
      ctx.arc(x + 3, y - 3, 2, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = '#000000';
      ctx.beginPath();
      ctx.arc(x - 3, y - 3, 0.8, 0, Math.PI * 2);
      ctx.arc(x + 3, y - 3, 0.8, 0, Math.PI * 2);
      ctx.fill();
    }

    function draw() {
      // Clear with background color
      ctx.fillStyle = getThemeColor('--board-bg', '#070a13');
      ctx.fillRect(0, 0, WIDTH, HEIGHT);

      // Draw background space stars
      ctx.fillStyle = 'rgba(255, 255, 255, 0.5)';
      stars.forEach(s => {
        ctx.globalAlpha = s.opacity;
        ctx.fillRect(s.x, s.y, s.size, s.size);
      });
      ctx.globalAlpha = 1.0; // Reset

      // Render River (rows 1-4: 64 to 256)
      ctx.fillStyle = '#051226';
      ctx.fillRect(0, 64, WIDTH, 192);
      // River ripples
      ctx.strokeStyle = 'rgba(0, 240, 255, 0.08)';
      ctx.lineWidth = 1;
      for (let i = 0; i <= 4; i++) {
        const y = 64 + i * 48;
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(WIDTH, y);
        ctx.stroke();
      }

      // Render Road (rows 6-10: 304 to 544)
      ctx.fillStyle = '#09090f';
      ctx.fillRect(0, 304, WIDTH, 240);
      // Lane dividers
      ctx.strokeStyle = 'rgba(255, 0, 127, 0.12)';
      ctx.lineWidth = 2;
      ctx.setLineDash([12, 18]);
      for (let i = 1; i <= 4; i++) {
        const y = 304 + i * 48;
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(WIDTH, y);
        ctx.stroke();
      }
      ctx.setLineDash([]); // reset

      // Draw Safe Banking Zone (Row 5: 256 to 304)
      ctx.fillStyle = '#0d1324';
      ctx.fillRect(0, 256, WIDTH, 48);
      ctx.strokeStyle = 'var(--border)';
      ctx.lineWidth = 2;
      ctx.strokeRect(0, 256, WIDTH, 48);

      // Draw Safe Spawn Walks (Row 11 & 12: 544 to 640)
      ctx.fillStyle = '#0a0d17';
      ctx.fillRect(0, 544, WIDTH, 96);
      ctx.strokeStyle = 'var(--border)';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(0, 544);
      ctx.lineTo(WIDTH, 544);
      ctx.stroke();

      // Goal Zone (Row 0: 0 to 64)
      ctx.fillStyle = '#030a17';
      ctx.fillRect(0, 0, WIDTH, 64);
      ctx.strokeRect(0, 0, WIDTH, 64);

      // Render Goal Target bays (10 columns, 48px width each)
      for (let col = 0; col < 10; col++) {
        const x = col * 48;
        if (col % 2 === 0) {
          // Blockers
          ctx.fillStyle = 'var(--accent-pink)';
          ctx.fillRect(x + 2, 2, 44, 58);
          // Neon outline
          ctx.strokeStyle = 'rgba(255, 0, 127, 0.35)';
          ctx.strokeRect(x + 2, 2, 44, 58);
        } else {
          // Safe Bays / Open Target Slots
          const index = (col - 1) / 2;
          ctx.strokeStyle = 'rgba(74, 222, 128, 0.4)';
          ctx.lineWidth = 2;
          ctx.strokeRect(x + 4, 12, 40, 42);

          if (filledGoals[index]) {
            drawSavedFrog(x + 24, 32);
          }
        }
      }

      // Draw River Logs
      riverPlatforms.forEach(p => {
        ctx.fillStyle = 'rgba(0, 240, 255, 0.2)';
        ctx.fillRect(p.x, p.y - 18, p.width, 36);
        ctx.strokeStyle = p.color;
        ctx.lineWidth = 2;
        ctx.strokeRect(p.x, p.y - 18, p.width, 36);

        // Cyber accents on platform
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.2)';
        ctx.strokeRect(p.x + 8, p.y - 10, p.width - 16, 20);
      });

      // Draw Road Vehicles
      roadObstacles.forEach(obs => {
        ctx.fillStyle = 'rgba(255, 0, 127, 0.2)';
        ctx.fillRect(obs.x, obs.y - 14, obs.width, 28);

        ctx.save();
        ctx.shadowBlur = 8;
        ctx.shadowColor = obs.color;
        ctx.strokeStyle = obs.color;
        ctx.lineWidth = 2;
        ctx.strokeRect(obs.x, obs.y - 14, obs.width, 28);
        ctx.restore();

        // Front headlights & back brake lights
        if (obs.speed > 0) {
          // Right facing headlights
          ctx.fillStyle = '#ffffff';
          ctx.fillRect(obs.x + obs.width - 5, obs.y - 10, 4, 3);
          ctx.fillRect(obs.x + obs.width - 5, obs.y + 7, 4, 3);
          // Left facing brakelights
          ctx.fillStyle = '#ff0055';
          ctx.fillRect(obs.x + 1, obs.y - 10, 2, 3);
          ctx.fillRect(obs.x + 1, obs.y + 7, 2, 3);
        } else {
          // Left facing headlights
          ctx.fillStyle = '#ffffff';
          ctx.fillRect(obs.x + 1, obs.y - 10, 4, 3);
          ctx.fillRect(obs.x + 1, obs.y + 7, 4, 3);
          // Right facing brakelights
          ctx.fillStyle = '#ff0055';
          ctx.fillRect(obs.x + obs.width - 3, obs.y - 10, 2, 3);
          ctx.fillRect(obs.x + obs.width - 3, obs.y + 7, 2, 3);
        }
      });

      // Render Particles
      particles.forEach(p => {
        ctx.save();
        ctx.globalAlpha = p.alpha;
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      });

      // Draw Player Frog
      if (state === 'playing' || state === 'paused') {
        drawPlayer();
      }
    }

    // Main animation loop
    function loop() {
      update();
      draw();
      requestAnimationFrame(loop);
    }

    // First frame render
    initStars();
    initLevel();
    draw();
    loop();

  })();
</script>
</body>
